# Workspace bindings for the realmarkets/dex monorepo.
#
# Usage (from the move-bindgen repo root):
#   cargo run -p move-bindgen-cli -- install \
#       --config configs/exchange.toml \
#       --input-folder /path/to/dex
#   cargo run -p move-bindgen-cli -- generate --config configs/exchange.toml
#
# Only top-level packages are listed — auto-discovery walks each
# Move.toml's `[dependencies]` and pulls in the rest (iota-framework,
# move-stdlib, fixed18, funding, oracle-price-feed, ring-buffer, tuple
# all come along for the ride via the exchange package alone).
#
# Iota and MoveStdlib generate as peer crates rather than routing into
# the runtime, because we override the default framework_packages.
# Codegen's well-known mappings still route the basics (UID, ID, Option,
# String) through the runtime — see crates/move-bindgen/src/codegen for
# the skip list.

# Override the default ["Iota", "MoveStdlib"] — we let auto-discovery
# pull them in as peer packages so they generate their own crates
# instead of being skipped. (Must sit at top level, before any [section]
# header.)
framework_packages = []

[output]
format  = "workspace"
name    = "exchange-rs"
runtime = { path = "../crates/move-bindgen-runtime" }

# Roots. Auto-discovery handles transitives. Each entry below is
# something whose source isn't reachable from another listed package.

[packages.exchange]
path = "packages/exchange"

[packages.account-registry]
path = "packages/account-registry"

[packages.faucet]
path = "packages/faucet"

[packages.metadata]
path = "packages/metadata"

[packages.oracle-mock-source]
path = "packages/oracle-mock-source"

# oracle-pyth-source is omitted: it depends on Pyth's git crate which
# we have no local source for. Add a `[packages.pyth]` entry pointing at
# a local Pyth checkout (or use configs/pyth.toml) if you need bindings
# for it.

[packages.soul-bound]
path = "packages/soul-bound"

[packages.stable]
path = "packages/stable"

[packages.test]
path = "packages/test"
