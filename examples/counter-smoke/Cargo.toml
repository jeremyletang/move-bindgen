[package]
name = "counter-smoke"
version = "0.1.0"
edition = "2021"
publish = false
description = "Smoke test for the generated counter-rs bindings."

[dependencies]
counter-rs              = { path = "../counter-rs" }
move-bindgen-runtime    = { path = "../../crates/move-bindgen-runtime", features = ["graphql-client"] }
iota-sdk-types          = { git = "https://github.com/iotaledger/iota-rust-sdk.git", rev = "dee951f490769f46c78ce84058f5d3cb8b606fd7", default-features = false }
iota-sdk-crypto         = { git = "https://github.com/iotaledger/iota-rust-sdk.git", rev = "dee951f490769f46c78ce84058f5d3cb8b606fd7", default-features = false }
iota-sdk-graphql-client = { git = "https://github.com/iotaledger/iota-rust-sdk.git", rev = "dee951f490769f46c78ce84058f5d3cb8b606fd7", default-features = false }
tokio                   = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
hex                     = "0.4"

# Detach from any parent workspace so this crate is independent of the
# move-bindgen one (counter-rs is its own workspace too).
[workspace]
