[workspace]
resolver = "2"
members = [
    "crates/move-bindgen",
    "crates/move-bindgen-cli",
    "crates/move-bindgen-ext-iota",
    "crates/move-bindgen-ext-sui",
    "crates/move-bindgen-runtime-iota",
    "crates/move-bindgen-runtime-sui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["jeremy <me@jeremyletang.com>"]
repository = "https://github.com/jeremyletang/move-bindgen"

[workspace.dependencies]
# Internal crates.
#
# `move-bindgen-runtime` / `move-bindgen-ext` here are local *aliases*
# (via Cargo's `package = ...`) that point at the IOTA-flavoured crates.
# Internal Rust source can still write `use move_bindgen_runtime::*;`
# regardless of flavour; only the alias target changes when we add Sui.
move-bindgen              = { path = "crates/move-bindgen" }
move-bindgen-runtime-iota = { path = "crates/move-bindgen-runtime-iota" }
move-bindgen-ext-iota     = { path = "crates/move-bindgen-ext-iota" }
move-bindgen-runtime-sui  = { path = "crates/move-bindgen-runtime-sui" }
move-bindgen-ext-sui      = { path = "crates/move-bindgen-ext-sui" }
move-bindgen-runtime      = { package = "move-bindgen-runtime-iota", path = "crates/move-bindgen-runtime-iota" }
move-bindgen-ext          = { package = "move-bindgen-ext-iota", path = "crates/move-bindgen-ext-iota" }

# Used by both the runtime and generated code
serde           = { version = "1", features = ["derive"] }
serde_json      = "1"
bcs             = "0.1"
primitive-types = { version = "0.14", features = ["impl-serde"] }

# IOTA build chain — pinned git deps to the iota monorepo.
# Bump `IOTA_REV` together below when you want to update.
iota-move-build         = { git = "https://github.com/iotaledger/iota.git", rev = "555e20ec91" }
iota-package-management = { git = "https://github.com/iotaledger/iota.git", rev = "555e20ec91" }
move-binary-format       = { git = "https://github.com/iotaledger/iota.git", rev = "555e20ec91" }
move-bytecode-source-map = { git = "https://github.com/iotaledger/iota.git", rev = "555e20ec91" }
move-bytecode-utils      = { git = "https://github.com/iotaledger/iota.git", rev = "555e20ec91" }
move-core-types         = { git = "https://github.com/iotaledger/iota.git", rev = "555e20ec91" }
move-package            = { git = "https://github.com/iotaledger/iota.git", rev = "555e20ec91" }
move-symbol-pool        = { git = "https://github.com/iotaledger/iota.git", rev = "555e20ec91" }
move-command-line-common = { git = "https://github.com/iotaledger/iota.git", rev = "555e20ec91" }

# Sibling SDK — canonical client-side surface (PTB types + builder).
iota-sdk-types               = { git = "https://github.com/iotaledger/iota-rust-sdk.git", rev = "dee951f490769f46c78ce84058f5d3cb8b606fd7", default-features = false }
iota-sdk-transaction-builder = { git = "https://github.com/iotaledger/iota-rust-sdk.git", rev = "dee951f490769f46c78ce84058f5d3cb8b606fd7", default-features = false }
iota-sdk-crypto              = { git = "https://github.com/iotaledger/iota-rust-sdk.git", rev = "dee951f490769f46c78ce84058f5d3cb8b606fd7", default-features = false }
iota-sdk-graphql-client      = { git = "https://github.com/iotaledger/iota-rust-sdk.git", rev = "dee951f490769f46c78ce84058f5d3cb8b606fd7", default-features = false }

# Sui Rust SDK — pinned to a specific revision for the Sui-flavoured
# runtime crate (`move-bindgen-runtime-sui`). Naming differs from
# IOTA's: `sui-sdk-types` (matches), but `sui-transaction-builder`
# drops the `-sdk-` infix.
sui-sdk-types          = { git = "https://github.com/mystenlabs/sui-rust-sdk.git", rev = "355d9ddf1c2e939fcc378a9733800e7d2caf4612", default-features = false }
sui-transaction-builder = { git = "https://github.com/mystenlabs/sui-rust-sdk.git", rev = "355d9ddf1c2e939fcc378a9733800e7d2caf4612", default-features = false }
sui-crypto             = { git = "https://github.com/mystenlabs/sui-rust-sdk.git", rev = "355d9ddf1c2e939fcc378a9733800e7d2caf4612", default-features = false }

# Local-dev override: uncomment to point all iota git deps at a sibling checkout.
# [patch."https://github.com/iotaledger/iota.git"]
# iota-move-build         = { path = "../iota/crates/iota-move-build" }
# iota-package-management = { path = "../iota/crates/iota-package-management" }
# move-binary-format      = { path = "../iota/external-crates/move/crates/move-binary-format" }
# move-bytecode-utils     = { path = "../iota/external-crates/move/crates/move-bytecode-utils" }
# move-core-types         = { path = "../iota/external-crates/move/crates/move-core-types" }
# move-package            = { path = "../iota/external-crates/move/crates/move-package" }
# move-symbol-pool        = { path = "../iota/external-crates/move/crates/move-symbol-pool" }
# [patch."https://github.com/iotaledger/iota-rust-sdk.git"]
# iota-sdk-types               = { path = "../iota-rust-sdk/crates/iota-sdk-types" }
# iota-sdk-transaction-builder = { path = "../iota-rust-sdk/crates/iota-sdk-transaction-builder" }

# Codegen
syn          = { version = "2", features = ["full"] }
quote        = "1"
proc-macro2  = "1"
prettyplease = "0.2"

# Common
anyhow    = "1"
thiserror = "2"
clap      = { version = "4", features = ["derive"] }
toml      = "0.8"
sha2      = "0.10"
hex       = "0.4"
gag       = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
