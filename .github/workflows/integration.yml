name: Integration

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ref: https://mathio28.medium.com/squeezing-disk-space-from-github-actions-runners-an-engineers-guide-d5fbe4443692
      - name: Aggressive cleanup
        continue-on-error: true
        timeout-minutes: 2
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/julia*
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /opt/microsoft /opt/google
          sudo rm -rf /opt/az
          docker system prune -af || true
          docker builder prune -af || true
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "build-and-test"

      - name: Increase swap
        run: |
          sudo swapoff -a
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: sccache stats (before build)
        run: sccache --show-stats

      - name: Build workspace
        run: cargo build --workspace --locked

      - name: Run tests
        run: cargo test --workspace --locked
        env:
          CARGO_PROFILE_DEV_CODEGEN_UNITS: "16"

      - name: Smoke-test — dump example package IR
        run: ./target/debug/move-bindgen dump packages/counter-iota

      - name: Smoke-test — IOTA counter (generate + type-check + offline PTB test)
        # `cargo check` is enough: we just need to confirm the generated
        # source type-checks against the current runtime. No `--locked`
        # because the crate is regenerated each run with no committed
        # `Cargo.lock` to lock against.
        #
        # `--runtime-path` overrides the CLI's default (a git dep on
        # the public move-bindgen repo). Without this override, the
        # generated `counter-iota-rs/Cargo.toml` would pull
        # `move-bindgen-runtime` from git master while the smoke crate
        # uses a path-dep on the in-repo runtime — same crate name, two
        # different builds in one Cargo graph → type mismatches.
        run: |
          ./target/debug/move-bindgen generate packages/counter-iota \
              --runtime-path ../../crates/move-bindgen-runtime-iota \
              -o generated/counter-iota-rs
          (cd generated/counter-iota-rs && cargo check)
          (cd tests/counter-smoke-iota && cargo test && cargo check --examples)

      - name: Smoke-test — Sui counter (generate + type-check + offline PTB test)
        # Mirror of the IOTA smoke for the Sui flavour. The generated
        # crate lands next to its config (`configs/counter-sui-rs`)
        # because that's where the smoke crate's `[dependencies]`
        # points; we don't need to redirect with `-o`.
        run: |
          ./target/debug/move-bindgen install  --config configs/counter-sui.toml
          ./target/debug/move-bindgen generate --config configs/counter-sui.toml
          (cd configs/counter-sui-rs && cargo check)
          (cd tests/counter-smoke-sui && cargo test && cargo check --examples)

      - name: Smoke-test — DeepBook v3 workspace build (full Sui multi-package)
        # End-to-end exercise of the Sui workspace path: fetches every
        # deepbookv3 package + its Pyth / Wormhole transitives,
        # compiles them through sui-move-build, runs codegen for the
        # whole workspace, and type-checks the resulting Rust crates.
        # If anything in the framework-aware staging rewrite, the
        # synthetic-address overrides, or the per-flavour codegen
        # regresses, this step catches it.
        run: |
          ./target/debug/move-bindgen build --config configs/deepbookv3.toml
          (cd configs/deepbookv3-rs && cargo check)

      - name: sccache stats (after build)
        run: sccache --show-stats

  check-code-quality:
    name: Check code quality
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "check-code-quality"

      - name: sccache stats (before build)
        run: sccache --show-stats

      - name: Check code format
        run: cargo fmt --all -- --check

      - name: Lint code
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: sccache stats (after build)
        run: sccache --show-stats
